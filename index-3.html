<style>
:root{--bg:#f4f1ec;--surface:#fff;--ink:#14284b;--muted:#66728a;--line:#e1dccf;--accent:#14284b;--accent-ink:#fff;--gold:#b8793f;--ok:#1d7a4d;--warn:#9a5b00;--danger:#a3283a;--info:#1f5fa8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1624;--surface:#15233a;--ink:#e9eef6;--muted:#9fb0c8;--line:#27395a;--accent:#d3a46a;--accent-ink:#0d1624;--gold:#d3a46a;--ok:#5bc58f;--warn:#e0a54a;--danger:#ef8091;--info:#7fb3ee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1624;--surface:#15233a;--ink:#e9eef6;--muted:#9fb0c8;--line:#27395a;--accent:#d3a46a;--accent-ink:#0d1624;--gold:#d3a46a;--ok:#5bc58f;--warn:#e0a54a;--danger:#ef8091;--info:#7fb3ee;color-scheme:dark}
.lg img{width:46px;height:auto;border-radius:8px;display:block}.lg-d{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-l{display:none!important}:root:not([data-theme="light"]) .lg-d{display:block!important}}
:root[data-theme="dark"] .lg-l{display:none!important}:root[data-theme="dark"] .lg-d{display:block!important}
.login .brand img{width:64px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;line-height:1.6;font-size:16px}
.app{max-width:1000px;margin:0 auto;padding:16px 16px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0 14px}
.brand{display:flex;align-items:center;gap:10px}

.brand b{display:block;font-size:1.2rem;line-height:1.2}
.brand small{color:var(--gold);letter-spacing:.12em;font-weight:700;font-size:.72rem}
.who{margin-inline-start:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.92rem}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{border-radius:10px;padding:8px 16px;background:transparent;border:1px solid transparent}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
button{font:inherit;cursor:pointer;border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.small{padding:4px 11px;font-size:.88rem}
button.danger{color:var(--danger)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
label{display:block;font-weight:500;font-size:.92rem;margin-bottom:3px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.panel h2,.panel h3{margin:0 0 12px;font-size:1.1rem}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card span{color:var(--muted);font-size:.88rem;display:block}
.card b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.88rem}
td.num{font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.82rem;border:1px solid currentColor;white-space:nowrap}
.s-new{color:var(--info)}.s-processing{color:var(--warn)}.s-done{color:var(--ok)}.s-rejected{color:var(--danger)}
.muted{color:var(--muted)}.msg{color:var(--warn);min-height:1.5em;font-size:.92rem}
.empty{padding:24px;text-align:center;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.login{max-width:380px;margin:8vh auto}
.login .brand{justify-content:center;margin-bottom:18px}
.log{font-size:.88rem;color:var(--muted);margin:8px 0 0;padding-inline-start:18px}
.chk{display:flex;gap:6px;align-items:center;font-weight:400}.chk input{width:auto}
details.t{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface)}
details.t summary{cursor:pointer;padding:12px 14px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline;list-style:none}
details.t summary::-webkit-details-marker{display:none}
details.t .tb{padding:4px 14px 14px;border-top:1px solid var(--line)}
.sheet{display:none}.sheet table{width:100%;border-collapse:collapse}.sheet th,.sheet td{border:1px solid #000;padding:6px;color:#000}
.sheet h2{font-size:1.6rem}.sheet dl{display:grid;grid-template-columns:200px 1fr;gap:8px 16px;font-size:1.1rem}.sheet dd{margin:0;font-weight:700}
.sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}.sig{text-align:center;font-weight:700;padding-top:30px;border-top:1px solid #000}
@media print{body{background:#fff;color:#000}body.printing .app{display:none}body.printing .sheet{display:block;padding:24px;color:#000}}
.app{max-width:1240px}.lay{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;position:sticky;top:10px}
.side button{display:block;width:100%;text-align:right;border:0;background:transparent;padding:9px 12px;border-radius:8px;margin-bottom:2px}
.side button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.side .gh{display:flex;justify-content:space-between;font-weight:700;color:var(--gold)}
.side .sub{margin:0 10px 8px 0;padding-inline-start:8px;border-inline-start:2px solid var(--line)}
html,body{overflow-x:hidden;max-width:100%}
.app,.lay>*{min-width:0}
@media(max-width:760px){.lay{grid-template-columns:minmax(0,1fr)}.side{position:static}
.app{padding:10px 10px 50px}
header.top{position:static!important;padding:4px 0 10px;gap:8px;margin-bottom:8px}
.brand img{width:40px;height:40px}.brand small{display:none}
.who{width:100%;margin:0;gap:6px;font-size:.85rem}.who>span{flex:1 1 100%}
.who .small{padding:6px 10px;font-size:.82rem}
.tw,.panel{overflow-x:auto;max-width:100%}
#mgp{scroll-margin-top:10px}}
header.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:12px}.nb{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--danger);color:#fff;font-weight:700;font-size:.8rem;text-align:center}
#mgp{scroll-margin-top:90px}
</style>
</head>

  if(reqAttach){t.attach=reqAttach;reqAttach=null}t.log.push(t.created+" — رُفع الطلب بواسطة "+u.name);S.tickets.push(t);
  notify(t.assignedTo,t.id,u.name+" أرسل لك طلب #"+t.no+" — "+t.serviceName);
  var mg1=mgrOf(u);if(mg1&&mg1.id!==u.id&&mg1.id!==t.assignedTo&&!t.support)notify(mg1.id,t.id,u.name+" رفع طلب #"+t.no+" — "+t.serviceName);
  audit(u,"إرسال طلب","#"+t.no+" "+t.serviceName+" → "+nm(t.assignedTo));save();sel=null;tab="pend";msg="تم رفع الطلب برقم #"+t.no+" وإرساله إلى "+nm(t.assignedTo)+".";render()};
 if($("addc"))$("addc").onclick=function(){var no=$("nno").value.trim(),n=$("nnm").value.trim();
  if(!no||!n){setMsg("اكتب رقم العقد واسمه.");render();return}
  if(cContracts(u).some(function(c){return c.no===no})){setMsg("رقم العقد موجود قبل كده.");render();return}
  S.contracts.unshift({id:uid(),companyId:u.companyId,no:no,name:n,ships:[]});save();setMsg("اتضاف العقد.");render()};
 q("[data-dc]",function(b){b.onclick=function(){uiAsk("حذف العقد وكل شحناته؟",function(){audit(u,"حذف عقد",by(S.contracts,b.dataset.dc).no);S.contracts=S.contracts.filter(function(c){return c.id!==b.dataset.dc});save();render()})}});
 if($("adds"))$("adds").onclick=function(){var n=$("sn").value.trim();if(!n){setMsg("اكتب اسم الخدمة.");render();return}
  S.services.push({id:uid(),companyId:u.companyId,name:n,cat:$("sc").value.trim(),ship:$("ss").checked,attach:$("sa").checked,handler:$("sh").value||null,fields:$("sf").value.split("\n").map(function(x){return x.trim()}).filter(Boolean)});save();setMsg("اتضافت الخدمة وظهرت لموظفي الشركة.");render()};
 q("[data-sh]",function(s){s.onchange=function(){by(S.services,s.dataset.sh).handler=s.value||null;save()}});
 q("[data-ds]",function(b){b.onclick=function(){uiAsk("حذف الخدمة؟",function(){audit(u,"حذف خدمة",by(S.services,b.dataset.ds).name);S.services=S.services.filter(function(s){return s.id!==b.dataset.ds});save();render()})}});
 if($("addu"))$("addu").onclick=function(){var n=$("un").value.trim(),un=$("uu").value.trim(),p=$("up").value;
  if(!n||!un||!p){setMsg("الاسم واسم المستخدم وكلمة السر مطلوبين.");render();return}
  if(S.users.some(function(x){return x.username===un})){setMsg("اسم المستخدم مستخدم قبل كده.");render();return}
  var cc=[];q(".uc",function(c){if(c.checked)cc.push(c.value)});
  S.users.push({id:uid(),username:un,ph:H(p),name:n,title:$("ut").value.trim(),role:"staff",companyId:u.companyId,seeAll:$("us").checked,canCreate:cc,perm:(function(){var o={};q(".npm",function(k){o[k.value]=k.checked});return o})()});save();setMsg("اتضاف المستخدم.");render()};
 q(".grp",function(g){g.onchange=function(){var sc=g.dataset.scope,ct=g.dataset.cat;q('input[data-scope="'+sc+'"][data-cat="'+ct+'"]:not(.grp)',function(k){k.checked=g.checked});if(ct==="مالية")q('input[data-scope="'+sc+'"][data-k]',function(k){if(["ships","suppliers","contracts","report","compare"].indexOf(k.dataset.k)>-1)k.checked=g.checked})}});
 q("[data-spm]",function(b){b.onclick=function(){var x=by(S.users,b.dataset.spm),id=x.id,o={},cc=[];q(".ep-"+id,function(k){o[k.dataset.k]=k.checked});q(".ev-"+id,function(k){if(k.checked)cc.push(k.value)});x.perm=o;x.canCreate=cc;x.seeAll=$("es-"+id).checked;audit(u,"تعديل صلاحيات",x.name);save();setMsg("تم حفظ صلاحيات "+x.name+".");render()}});
 q("[data-du]",function(b){b.onclick=function(){uiAsk("حذف المستخدم؟",function(){audit(u,"حذف مستخدم",by(S.users,b.dataset.du).name);S.users=S.users.filter(function(x){return x.id!==b.dataset.du});S.services.forEach(function(s){if(s.handler===b.dataset.du)s.handler=null});save();render()})}});
 q("[data-pw]",function(b){b.onclick=function(){uiAsk("كلمة السر الجديدة:",function(p){if(p){by(S.users,b.dataset.pw).ph=H(p);save();setMsg("اتغيرت كلمة السر.");render()}},{input:1})}});
}

function render(){
 var u=user();if(!u||u.active===false){loginView();return}
 if(u.role==="admin")adminView(u);else companyView(u);
 Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"),function(b){b.onclick=function(){go(b.dataset.tab);if(window.innerWidth<=760){var m=document.querySelector(".main");if(m&&m.scrollIntoView)m.scrollIntoView()}}});
 Array.prototype.forEach.call(document.querySelectorAll("[data-g]"),function(b){b.onclick=function(){og[b.dataset.g]=!og[b.dataset.g];render()}});
 var lg=function(){if(u.role==="admin"){asel=null;tab="adash"}else{tab="dash";sel=null}msg="";nsel=null;render()};$("logo").onclick=lg;$("logo").onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();lg()}};
 $("out").onclick=function(){me=null;try{sessionStorage.removeItem("sb-u")}catch(e){}render()};
 if($("thm"))$("thm").onclick=toggleTheme;
 if($("pw"))$("pw").onclick=function(){uiAsk("كلمة السر الجديدة:",function(p){if(p){u.ph=H(p);u.pt=p;save();uiAsk("تم التغيير.",function(){},{alert:1})}},{input:1})};
}
window.addEventListener("storage",function(){var a=document.activeElement,tg=a&&a.tagName;if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT")return;load();render()});
load();render();
})();
